<section class="hero">
  <div class="hero-media" [style.backgroundImage]="'url(assets/hero.jpg)'"></div>
  <div class="hero-overlay"></div>
  <div class="hero-inner">
    <img src="assets/logo-white.svg" alt="Stiven7ink" class="hero-logo" />
    <h1>Arte que llevas para siempre</h1>
    <p class="lead">Diseños personalizados · Higiene profesional · Reserva fácil</p>
    <div class="hero-ctas">
      <a routerLink="/portfolio" class="btn primary">Ver Portafolio</a>
      <a routerLink="/appointments" class="btn outline">Agendar Cita</a>
    </div>
  </div>
</section>

<section class="features-section">
  <div class="container">

  </div>
</section>

<section class="portfolio-preview">
  <div class="grid">
    <a *ngFor="let p of preview" class="item" (click)="open(p)">
      <img [src]="p.imageUrl" alt="">
      <div class="meta">
        <h4>{{p.title}}</h4>
      </div>
    </a>
  </div>
  <div class="cta"><a routerLink="/portfolio" class="btn primary">Ver todo el portafolio</a></div>
</section>
