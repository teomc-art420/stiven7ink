<section class="blog-section">
  <div class="container">
    <div class="blog-header">
      <h1>Blog</h1>
      <p class="subtitle">Entrevistas en vídeo, consejos y novedades</p>
    </div>

    <div *ngIf="loading" class="loading-container">
      <mat-spinner diameter="50"></mat-spinner>
    </div>

    <div *ngIf="!loading && posts.length === 0" class="empty-state">
      <mat-icon>article</mat-icon>
      <p>No hay artículos publicados aún.</p>
    </div>

    <div *ngIf="!loading && posts.length > 0" class="blog-grid">
      <article class="blog-card" *ngFor="let post of posts">
        <div class="blog-media">
          <ng-container *ngIf="isVideoPost(post); else blogCoverImage">
            <video
              class="blog-video"
              [src]="getMediaSrc(post)"
              controls
              playsinline
              preload="metadata"></video>
          </ng-container>
          <ng-template #blogCoverImage>
            <img [src]="getMediaSrc(post) || 'assets/placeholder-blog.jpg'" [alt]="post.title">
          </ng-template>
        </div>
        <div class="blog-content">
          <span class="blog-date">
            {{ post.createdAt?.seconds * 1000 | date:'longDate' }}
          </span>
          <h2>{{ post.title }}</h2>
          <p class="blog-excerpt">
            {{ post.content }}
          </p>
          <!-- <a href="#" class="read-more">Leer más →</a> -->
        </div>
      </article>
    </div>
  </div>
</section>
