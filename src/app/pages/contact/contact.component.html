<section class="contact-section">
  <div class="container">
    <div class="contact-header">
      <h1>Contacto</h1>
      <p class="subtitle">¿Tienes alguna pregunta o idea? Escríbeme.</p>
    </div>

    <div class="contact-content">
      <div class="contact-info">
        <div class="info-item">
          <h3>Ubicación</h3>
          <p>Medellín, Colombia</p>
        </div>
        <div class="info-item">
          <h3>Email</h3>
          <p>contacto#!64stiven7ink.com</p>
        </div>
        <div class="info-item">
          <h3>Redes Sociales</h3>
          <div class="social-links">
            <a href="#" target="_blank">Instagram</a>
            <a href="#" target="_blank">Facebook</a>
            <a href="#" target="_blank">WhatsApp</a>
          </div>
        </div>
      </div>

      <div class="contact-form-container">
        <form (ngSubmit)="onSubmit()" #contactForm="ngForm">
          <div class="form-group">
            <label for="name">Nombre *</label>
            <input type="text" id="name" name="name" [(ngModel)]="formData.name" required placeholder="Tu nombre">
          </div>

          <div class="form-group">
            <label for="email">Email *</label>
            <input type="email" id="email" name="email" [(ngModel)]="formData.email" required
              placeholder="tu@email.com">
          </div>

          <div class="form-group">
            <label for="subject">Asunto</label>
            <input type="text" id="subject" name="subject" [(ngModel)]="formData.subject"
              placeholder="Asunto del mensaje">
          </div>

          <div class="form-group">
            <label for="message">Mensaje *</label>
            <textarea id="message" name="message" [(ngModel)]="formData.message" required rows="5"
              placeholder="Escribe tu mensaje aquí..."></textarea>
          </div>

          <button mat-raised-button color="primary" type="submit" [disabled]="loading">
            <mat-spinner diameter="20" *ngIf="loading"></mat-spinner>
            <span *ngIf="!loading">ENVIAR MENSAJE</span>
          </button>
        </form>
      </div>
    </div>
  </div>
</section>
