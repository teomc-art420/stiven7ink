<div class="login-container">
    <mat-card class="login-card">
      <mat-card-header>
        <mat-card-title>Iniciar Sesión - Admin</mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <form (ngSubmit)="onSubmit()" class="login-form">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Email</mat-label>
            <input 
              matInput 
              type="email" 
              [(ngModel)]="email" 
              name="email"
              required
              placeholder="admin@stiven7ink.com">
          </mat-form-field>
  
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Contraseña</mat-label>
            <input 
              matInput 
              type="password" 
              [(ngModel)]="password" 
              name="password"
              required
              placeholder="Tu contraseña">
          </mat-form-field>
  
          @if (error) {
            <div class="error-message">
              {{ error }}
            </div>
          }
  
          <button 
            mat-raised-button 
            color="primary" 
            type="submit" 
            class="full-width"
            [disabled]="loading">
            @if (loading) {
              Iniciando sesión...
            } @else {
              Iniciar Sesión
            }
          </button>
        </form>
      </mat-card-content>
    </mat-card>
  </div>
